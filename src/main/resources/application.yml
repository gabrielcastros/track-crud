spring:
  application:
    name: trackcrud

  jpa:
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: true

logging:
  level:
    org.hibernate.SQL: DEBUG